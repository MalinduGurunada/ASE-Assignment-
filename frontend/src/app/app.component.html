<ng-container *ngIf="isAuthRoute; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #appShell>

  <!-- ── Top Navigation ── -->
  <header class="cf-topnav">
    <div class="cf-topnav-left">
      <button class="cf-nav-icon-btn" title="Apps">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="4" height="4" rx="1"/><rect x="17" y="3" width="4" height="4" rx="1"/>
          <rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="4" height="4" rx="1"/><rect x="17" y="10" width="4" height="4" rx="1"/>
          <rect x="3" y="17" width="4" height="4" rx="1"/><rect x="10" y="17" width="4" height="4" rx="1"/><rect x="17" y="17" width="4" height="4" rx="1"/>
        </svg>
      </button>
      <a routerLink="/dashboard" class="cf-logo">
        <span class="cf-logo-icon">R</span>
        <span class="cf-logo-text">RMT</span>
      </a>
      <nav class="cf-topnav-links">
        <a routerLink="/dashboard" routerLinkActive="active">Spaces</a>
        <a routerLink="/products" routerLinkActive="active">Recent</a>
      </nav>
    </div>

    <div class="cf-topnav-center">
      <div class="cf-search-wrap">
        <svg class="cf-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="cf-search-input" type="text" placeholder="Search RMT" />
      </div>
    </div>

    <div class="cf-topnav-right">
      <button class="cf-nav-icon-btn" title="Notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <button class="cf-nav-icon-btn" title="Help">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>
      <button class="cf-nav-icon-btn" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="cf-avatar-btn" (click)="logout()" title="Sign out">A</button>
    </div>
  </header>

  <!-- ── Body: sidebar + content ── -->
  <div class="cf-body">

    <!-- Left Sidebar -->
    <aside class="cf-sidebar">

      <!-- Create button -->
      <div class="cf-sidebar-create">
        <button routerLink="/products">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Create
        </button>
      </div>

      <!-- Space identity -->
      <div class="cf-sidebar-space">
        <div class="cf-sidebar-space-icon">R</div>
        <div>
          <div class="cf-sidebar-space-name">RMT</div>
          <div class="cf-sidebar-space-sub">Release Management</div>
        </div>
      </div>

      <nav class="cf-sidebar-nav">

        <!-- Global nav -->
        <a routerLink="/dashboard" routerLinkActive="cf-active" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Overview
        </a>

        <a routerLink="/products" routerLinkActive="cf-active" [routerLinkActiveOptions]="{exact:true}" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><path d="M8 7V5a2 2 0 0 0-4 0v2"/>
          </svg>
          Products
        </a>

        <a routerLink="/products/releases" routerLinkActive="cf-active" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
          </svg>
          Releases
        </a>

        <div class="cf-sidebar-section-label" style="margin-top:6px">Deployments</div>

        <a routerLink="/deployments" routerLinkActive="cf-active" [routerLinkActiveOptions]="{exact:true}" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          Tracking
        </a>

        <a routerLink="/deployments/rollbacks" routerLinkActive="cf-active" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
          </svg>
          Rollbacks
        </a>

        <div class="cf-sidebar-section-label" style="margin-top:10px">Account</div>

        <button class="cf-nav-item cf-nav-logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="cf-main">
      <router-outlet></router-outlet>
    </main>
  </div>

</ng-template>
