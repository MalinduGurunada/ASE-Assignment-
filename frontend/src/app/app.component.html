<ng-container *ngIf="isAuthRoute; else appShell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #appShell>

  <!-- ── Top Navigation ── -->
  <header class="cf-topnav">
    <div class="cf-topnav-left">
      <button class="cf-nav-icon-btn cf-grid-btn" title="Apps">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </button>
      <a routerLink="/dashboard" class="cf-logo">
        <span class="cf-logo-icon">R</span>
        <span class="cf-logo-text">RMT</span>
      </a>
      <nav class="cf-topnav-links">
        <a routerLink="/dashboard" routerLinkActive="active">Spaces</a>
        <a routerLink="/products" routerLinkActive="active">Recent</a>
        <a class="cf-create-btn btn-primary" routerLink="/products">+ Create</a>
      </nav>
    </div>

    <div class="cf-topnav-center">
      <div class="cf-search-wrap">
        <svg class="cf-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="cf-search-input" type="text" placeholder="Search RMT" />
      </div>
    </div>

    <div class="cf-topnav-right">
      <button class="cf-nav-icon-btn" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <button class="cf-nav-icon-btn" title="Help">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </button>
      <button class="cf-avatar-btn" (click)="logout()" title="Sign out">A</button>
    </div>
  </header>

  <!-- ── Body: sidebar + content ── -->
  <div class="cf-body">

    <!-- Left Sidebar -->
    <aside class="cf-sidebar">
      <div class="cf-sidebar-space">
        <div class="cf-sidebar-space-icon">R</div>
        <div>
          <div class="cf-sidebar-space-name">RMT</div>
          <div class="cf-sidebar-space-sub">Release Management Tool</div>
        </div>
      </div>

      <nav class="cf-sidebar-nav">
        <div class="cf-sidebar-section-label">CONTENT</div>

        <!-- Dashboard -->
        <a routerLink="/dashboard" routerLinkActive="cf-active" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>

        <!-- Products group -->
        <div class="cf-nav-group">
          <button class="cf-nav-item cf-nav-parent" (click)="productsOpen = !productsOpen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
            Products
            <svg class="cf-chevron" [class.open]="productsOpen" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          <div class="cf-nav-children" *ngIf="productsOpen">
            <a routerLink="/products" routerLinkActive="cf-active" [routerLinkActiveOptions]="{exact:true}" class="cf-nav-item cf-nav-child">
              Product List
            </a>
            <a routerLink="/products/releases" routerLinkActive="cf-active" class="cf-nav-item cf-nav-child">
              Releases
            </a>
          </div>
        </div>

        <!-- Deployments group -->
        <div class="cf-nav-group">
          <button class="cf-nav-item cf-nav-parent" (click)="deploymentsOpen = !deploymentsOpen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
            </svg>
            Deployments
            <svg class="cf-chevron" [class.open]="deploymentsOpen" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
          <div class="cf-nav-children" *ngIf="deploymentsOpen">
            <a routerLink="/deployments" routerLinkActive="cf-active" [routerLinkActiveOptions]="{exact:true}" class="cf-nav-item cf-nav-child">
              Tracking
            </a>
            <a routerLink="/deployments/rollbacks" routerLinkActive="cf-active" class="cf-nav-item cf-nav-child">
              Rollbacks
            </a>
          </div>
        </div>

        <div class="cf-sidebar-section-label" style="margin-top:1rem">ACCOUNT</div>
        <a routerLink="/auth/login" class="cf-nav-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Auth / Login
        </a>
        <button class="cf-nav-item cf-nav-logout" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign out
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="cf-main">
      <router-outlet></router-outlet>
    </main>
  </div>

</ng-template>
