<section class="auth-panel">
  <h2>Sign In</h2>
  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Username
      <input type="text" formControlName="username" placeholder="jane.doe" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" placeholder="********" />
    </label>
    <button type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Generate JWT' }}</button>
  </form>
  <p *ngIf="success" class="success">{{ success }}</p>
  <p *ngIf="tokenPreview" class="token">Token: {{ tokenPreview }}</p>
  <p *ngIf="error" class="error">{{ error }}</p>
</section>
