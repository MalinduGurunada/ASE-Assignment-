<div class="atlassian-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">R</div>
      <span class="auth-logo-text">RMT</span>
    </div>

    <h1 class="auth-title">Log in to continue</h1>
    <p class="auth-subtitle">Release Management Tool</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field-group">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" placeholder="Enter your username" autocomplete="username" />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" autocomplete="current-password" />
      </div>

      <div *ngIf="error" class="auth-alert auth-alert-error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        {{ error }}
      </div>

      <div *ngIf="success" class="auth-alert auth-alert-success">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        {{ success }}
      </div>

      <div *ngIf="tokenPreview" class="token-preview">Token: {{ tokenPreview }}</div>

      <button type="submit" class="auth-submit" [disabled]="loading">
        {{ loading ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <div class="auth-divider"><span>or</span></div>

    <a routerLink="/auth/register" class="auth-link-btn">Create an account</a>
  </div>
</div>
