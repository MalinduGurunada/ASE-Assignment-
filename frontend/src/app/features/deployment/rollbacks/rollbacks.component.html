<div class="cf-breadcrumb">
  <a routerLink="/dashboard">RMT</a>
  <span>›</span>
  <a routerLink="/deployments">Deployments</a>
  <span>›</span>
  <span>Rollbacks</span>
</div>

<div class="cf-page-header">
  <div>
    <div class="cf-page-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
      </svg>
    </div>
    <h1 class="cf-page-title">Rollback Operations</h1>
    <p class="cf-page-meta">Deployments available for rollback</p>
  </div>
</div>

<p *ngIf="error" class="inline-alert inline-alert-error">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
  {{ error }}
</p>

<div class="cf-table-wrap">
  <table>
    <thead>
      <tr>
        <th>Environment</th>
        <th>Release</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of deployments">
        <td class="td-env">
          <span class="env-dot" [class]="'env-' + d.environmentName.toLowerCase()"></span>
          {{ d.environmentName }}
        </td>
        <td>{{ d.releaseName }}</td>
        <td><span class="badge badge-yellow">{{ d.status }}</span></td>
        <td>
          <button class="btn-rollback" (click)="rollback(d)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
            Rollback
          </button>
        </td>
      </tr>
      <tr *ngIf="deployments.length === 0">
        <td colspan="4" class="td-empty">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#97a0af" stroke-width="1.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
          <div>No rollback-ready deployments found.</div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
