<section>
  <h2>Rollback Operations</h2>
  <p>Rollback-ready deployments are listed below.</p>
  <p *ngIf="error" class="error">{{ error }}</p>
  <ul>
    <li *ngFor="let deployment of deployments">
      {{ deployment.environmentName }} - {{ deployment.releaseName }} - {{ deployment.status }}
      <button type="button" (click)="rollback(deployment)">Rollback</button>
    </li>
  </ul>
</section>
