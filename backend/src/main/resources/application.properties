spring.application.name=rmt

# Database (PostgreSQL with fallback for local)
spring.datasource.url=${RMT_DB_URL:jdbc:postgresql://localhost:5432/rmt}
spring.datasource.username=${RMT_DB_USERNAME:postgres}
spring.datasource.password=${RMT_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=DEBUG

# JWT
security.jwt.secret=${RMT_JWT_SECRET:dev-secret-key-change-in-production}
security.jwt.expiration-seconds=3600