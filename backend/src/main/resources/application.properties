spring.application.name=rmt
spring.datasource.url=${RMT_DB_URL:jdbc:postgresql://localhost:5432/rmt}
spring.datasource.username=${RMT_DB_USERNAME:postgres}
spring.datasource.password=${RMT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
logging.level.org.springframework.security=DEBUG
security.jwt.secret=${RMT_JWT_SECRET}
security.jwt.expiration-seconds=3600
