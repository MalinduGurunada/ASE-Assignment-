# Supabase PostgreSQL connection
# Fill in RMT_DB_HOST, RMT_DB_PASSWORD, and RMT_JWT_SECRET from your Supabase project
spring.datasource.url=${RMT_DB_URL}
spring.datasource.username=${RMT_DB_USERNAME:postgres}
spring.datasource.password=${RMT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — Supabase closes idle connections after 60 s
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=25000

# Flyway — schema already applied via SQL Editor, so just validate
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.secret=${RMT_JWT_SECRET}
security.jwt.expiration-seconds=3600
logging.level.org.springframework.security=INFO
